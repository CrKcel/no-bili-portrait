<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">禁止竖屏</title>
  <desc id="desc">被划去的竖屏视频通过箭头转到横向播放器</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292E3B"/>
      <stop offset="1" stop-color="#171A22"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="110" x2="430" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7892"/>
      <stop offset="1" stop-color="#ED4264"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#080A0F" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#background)"/>
  <rect x="21" y="21" width="470" height="470" rx="117" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="72" y="92" width="142" height="306" rx="34" fill="#303643" stroke="#F6F8FC" stroke-width="14"/>
    <path d="M119 119h48" stroke="#F6F8FC" stroke-width="10" stroke-linecap="round" opacity=".75"/>
    <rect x="96" y="153" width="94" height="61" rx="14" fill="#F6F8FC" opacity=".13"/>
    <rect x="96" y="228" width="94" height="61" rx="14" fill="#F6F8FC" opacity=".13"/>
    <rect x="96" y="303" width="94" height="61" rx="14" fill="#F6F8FC" opacity=".13"/>

    <rect x="246" y="150" width="218" height="178" rx="30" fill="#303643" stroke="#F6F8FC" stroke-width="14"/>
    <path d="M330 201l70 38-70 38z" fill="url(#accent)"/>
    <path d="M277 299h156" stroke="#F6F8FC" stroke-width="8" stroke-linecap="round" opacity=".25"/>
    <path d="M277 299h83" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M63 390L225 104" stroke="url(#accent)" stroke-width="30" stroke-linecap="round"/>
  <path d="M188 411c76 30 171 11 217-52" fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round"/>
  <path d="M382 354l43-19-3 47z" fill="#ED4264"/>
</svg>
